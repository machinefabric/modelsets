name: Suggest Model Change
description: Propose changing one or more model recommendations in an existing curated set.
title: "Model suggestion: <set or slot>"
labels:
  - suggest-model-change
body:
  - type: markdown
    attributes:
      value: |
        Use this template when an existing curated set should swap one model for another, fill a missing slot, or retire a recommendation that no longer fits.
  - type: input
    id: target_set
    attributes:
      label: Target set
      description: Which curated set is affected?
      placeholder: everyday-essentials
    validations:
      required: true
  - type: input
    id: target_slot
    attributes:
      label: Target slot
      description: Which model slot or refined model-spec requirement is affected?
      placeholder: media:gguf;llm;model-spec;textable;tokenizer-embedded-gguf
    validations:
      required: true
  - type: input
    id: current_model
    attributes:
      label: Current recommended model
      placeholder: bartowski/Hermes-3-Llama-3.1-8B-GGUF
  - type: input
    id: proposed_model
    attributes:
      label: Proposed replacement model
      placeholder: bartowski/Mistral-Nemo-Instruct-2407-GGUF
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should this change be made?
      description: Explain the fit, quality, hardware, licensing, provenance, or maintenance reason.
    validations:
      required: true
