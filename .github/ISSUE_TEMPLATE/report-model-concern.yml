name: Report Model Safety / Provenance Concern
description: Report a serious concern about a recommended model or curated set.
title: "[Concern] <short summary>"
labels:
  - model-concern
body:
  - type: markdown
    attributes:
      value: |
        Use this template for serious issues with a recommended model or curated set: bad provenance, misleading packaging, malicious behavior, licensing red flags, or similar concerns.
  - type: input
    id: affected_set
    attributes:
      label: Affected set (optional)
      placeholder: frontier-2025
  - type: input
    id: affected_model
    attributes:
      label: Affected model
      placeholder: bartowski/Hermes-3-Llama-3.1-8B-GGUF
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What's the concern?
      description: Describe the issue clearly. Do not include secrets or private credentials.
    validations:
      required: true
